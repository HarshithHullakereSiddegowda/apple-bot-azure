name: Deploy

# Zero-downtime deploy to Azure Container Apps (multiple-revision mode):
#   CI gate -> build image (tag = git SHA) -> new revision at 0% traffic -> smoke-test it privately
#   -> shift 100% traffic -> smoke-test the public URL (auto-rollback on failure)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push the image to ghcr.io
  id-token: write   # OIDC: exchange GitHub's token for an Azure token (no stored secrets)

env:
  IMAGE: ghcr.io/harshithhullakeresiddegowda/apple-rag
  APP: apple-rag
  RG: rg-apple-rag
  PUBLIC_URL: https://apple-rag.agreeablestone-6fb7e6d2.australiaeast.azurecontainerapps.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production          # the Azure trust rule only accepts this environment
    concurrency:
      group: deploy-production       # never two deploys at once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: v
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC, no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Remember the live revision (rollback target)
        id: live
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          live=$(az containerapp ingress traffic show -n "$APP" -g "$RG" \
                   --query "[?weight > \`0\`].revisionName | [0]" -o tsv)
          echo "Live revision: $live"
          echo "revision=$live" >> "$GITHUB_OUTPUT"

      - name: Create new revision at 0% traffic
        id: new
        run: |
          suffix="sha-${{ steps.v.outputs.sha }}"
          az containerapp update -n "$APP" -g "$RG" \
            --image "$IMAGE:${{ github.sha }}" --revision-suffix "$suffix" --only-show-errors -o none
          rev="$APP--$suffix"
          for i in $(seq 1 30); do
            state=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$rev" \
                      --query properties.runningState -o tsv)
            echo "[$i] $rev: $state"
            case "$state" in Running|RunningAtMaxScale|Activating*) break;; Failed|Degraded) exit 1;; esac
            sleep 10
          done
          fqdn=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$rev" --query properties.fqdn -o tsv)
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the new revision privately (no users on it yet)
        run: scripts/smoke.sh "${{ steps.new.outputs.url }}"

      - name: Shift 100% traffic to the new revision
        run: |
          az containerapp ingress traffic set -n "$APP" -g "$RG" \
            --revision-weight "${{ steps.new.outputs.revision }}=100" --only-show-errors -o none
          echo "Traffic: ${{ steps.new.outputs.revision }} = 100%"

      - name: Smoke-test the public URL
        id: public
        run: scripts/smoke.sh "$PUBLIC_URL"

      - name: Roll back if the public smoke test failed
        if: failure() && steps.public.outcome == 'failure'
        run: |
          az containerapp ingress traffic set -n "$APP" -g "$RG" \
            --revision-weight "${{ steps.live.outputs.revision }}=100" --only-show-errors -o none
          echo "::error::Rolled back to ${{ steps.live.outputs.revision }}"

      - name: Deactivate the failed revision
        if: failure() && steps.new.outputs.revision != ''
        run: |
          az containerapp revision deactivate -n "$APP" -g "$RG" \
            --revision "${{ steps.new.outputs.revision }}" --only-show-errors || true

      - name: Keep only the new and previous revisions active
        if: success()
        run: |
          keep="${{ steps.new.outputs.revision }} ${{ steps.live.outputs.revision }}"
          for rev in $(az containerapp revision list -n "$APP" -g "$RG" \
                         --query "[?properties.active].name" -o tsv); do
            case " $keep " in *" $rev "*) ;; *) az containerapp revision deactivate -n "$APP" -g "$RG" \
                                                  --revision "$rev" --only-show-errors -o none && echo "deactivated $rev";; esac
          done
          {
            echo "### Deployed ${{ steps.new.outputs.revision }}"
            echo "- Image: \`$IMAGE:${{ github.sha }}\`"
            echo "- Previous (rollback target): \`${{ steps.live.outputs.revision }}\`"
            echo "- Rollback: \`az containerapp ingress traffic set -n $APP -g $RG --revision-weight ${{ steps.live.outputs.revision }}=100\`"
          } >> "$GITHUB_STEP_SUMMARY"
