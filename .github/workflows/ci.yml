name: CI

# Runs on every push and pull request. Needs no Azure access and no secrets.
on:
  push:
    branches-ignore: [main]   # on main, deploy.yml runs CI itself as its first gate
  pull_request:
  workflow_call:

# Least privilege: CI can only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}   # distinct group when called from deploy.yml
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit, API and golden-set tests (pytest)
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: apple-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image must not contain secrets or data
        run: |
          docker run --rm apple-rag:ci ls -A /app /app/tender
          leaks=$(docker run --rm apple-rag:ci find /app -name ".env*" -o -type d -name data \
                    -o -name "*profile*.md" -o -name "*notices*.json" -o -name "*label*")
          if [ -n "$leaks" ]; then
            echo "::error::private files found inside the image:"; echo "$leaks"; exit 1
          fi
